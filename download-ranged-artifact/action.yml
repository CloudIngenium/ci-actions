name: Download ranged artifact canary
description: Download one GitHub Actions artifact with bounded parallel ranges and verify its API digest before extraction.

inputs:
  repository:
    description: Owner/repository containing the workflow run.
    required: true
  run-id:
    description: Numeric workflow run ID containing the artifact.
    required: true
  artifact-name:
    description: Exact artifact name.
    required: true
  destination:
    description: Existing empty directory that receives the extracted artifact.
    required: true
  github-token:
    description: Short-lived GitHub token with Actions read permission.
    required: true
  range-count:
    description: Number of concurrent byte ranges. The canary contract permits 2-8.
    required: false
    default: "4"

outputs:
  artifact-id:
    description: Numeric GitHub Actions artifact ID.
  archive-bytes:
    description: Verified archive size in bytes.
  digest:
    description: Verified sha256 digest reported by the Actions API.
  duration-ms:
    description: Download and verification wall time in milliseconds.
  range-count:
    description: Number of ranges used.
  retry-count:
    description: Network retries used. The canary currently fails closed with zero retries.

runs:
  using: node24
  main: download-ranged-artifact.mjs
