name: Resolve exact GitHub job context
description: Resolve the numeric workflow job ID for the current runner without inventing an identity.

inputs:
  github-token:
    description: Token with Actions read permission for the current repository.
    required: true
  api-url:
    description: GitHub API base URL.
    required: false
    default: https://api.github.com
  cache-path:
    description: Context cache path relative to RUNNER_TEMP.
    required: false
    default: ci-job-context.json
  fail-on-unresolved:
    description: Fail the job when the current workflow job cannot be resolved exactly.
    required: false
    default: "false"

outputs:
  job-id:
    description: Exact numeric GitHub workflow job ID, or an empty value when unavailable.
  trace-id:
    description: Deterministic run-level trace ID.
  correlation-quality:
    description: exact or unavailable.
  reason:
    description: Bounded machine-readable resolution outcome.
  cache-hit:
    description: true when the exact context came from the job-local cache.

runs:
  using: node24
  main: resolve-job-context.mjs
