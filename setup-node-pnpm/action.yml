name: Set up Node and pnpm
description: Install an exact pnpm release in an isolated job directory after setting up Node.

outputs:
  pnpm-version:
    description: Exact pnpm version selected from the input, packageManager, or fallback.
    value: ${{ steps.resolve_pnpm.outputs.version }}
  cache-class:
    description: Exact initial state of the isolated pnpm store.
    value: ${{ steps.cache_evidence.outputs['cache-class'] }}
  cache-key-hash:
    description: SHA-256 cache key derived from Node, pnpm, and the lockfile.
    value: ${{ steps.cache_evidence.outputs['cache-key-hash'] }}
  lock-hash:
    description: SHA-256 of the selected lockfile, or of the explicit unavailable sentinel.
    value: ${{ steps.cache_evidence.outputs['lock-hash'] }}
  cache-observation-path:
    description: Canonical observation path when exact telemetry was requested.
    value: ${{ steps.emit_cache.outputs['payload-path'] }}
  telemetry-status:
    description: emitted or not_requested.
    value: ${{ steps.emit_cache.outputs['telemetry-status'] || steps.cache_evidence.outputs['telemetry-status'] }}

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node.
    required: false
    default: "24"
  pnpm-version:
    description: Exact stable pnpm version override. By default the action reads packageManager.
    required: false
    default: ""
  package-manager-file:
    description: package.json path, relative to the workspace, used to resolve packageManager.
    required: false
    default: "package.json"
  registry-url:
    description: Package registry configured by actions/setup-node.
    required: false
    default: "https://npm.pkg.github.com"
  scope:
    description: Package scope configured by actions/setup-node.
    required: false
    default: "@cloudingenium"
  lock-file:
    description: Dependency lockfile used to content-address the isolated pnpm store observation.
    required: false
    default: pnpm-lock.yaml
  job-id:
    description: Optional exact numeric job ID. When supplied with the manifest hash, emits cache evidence.
    required: false
    default: ""
  source-manifest-sha256:
    description: Optional Knowledge-Hub contract manifest SHA-256 used with job-id.
    required: false
    default: ""
  fingerprint-version:
    description: Knowledge-Hub fingerprint contract version recorded in cache evidence.
    required: false
    default: "10"
  pool-mapping-version:
    description: Knowledge-Hub pool mapping version recorded in cache evidence.
    required: false
    default: "11"
  policy-version:
    description: Knowledge-Hub CI policy version recorded in cache evidence.
    required: false
    default: local-first-shadow-v4.6.9-r5

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        check-latest: false

    - name: Resolve exact pnpm version
      id: resolve_pnpm
      shell: bash
      env:
        EXPLICIT_PNPM_VERSION: ${{ inputs.pnpm-version }}
        PACKAGE_MANAGER_FILE: ${{ inputs.package-manager-file }}
      run: |
        set -euo pipefail
        manifest="$PACKAGE_MANAGER_FILE"
        if [[ "$manifest" != /* ]]; then
          manifest="$GITHUB_WORKSPACE/$manifest"
        fi
        version="$(node "$GITHUB_ACTION_PATH/resolve-pnpm-version.mjs" \
          --explicit "$EXPLICIT_PNPM_VERSION" \
          --manifest "$manifest" \
          --fallback "11.13.0")"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install exact pnpm in an isolated prefix
      shell: bash
      env:
        PNPM_VERSION: ${{ steps.resolve_pnpm.outputs.version }}
      run: |
        set -euo pipefail

        pnpm_root="${RUNNER_TEMP}/pnpm-cli-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
        rm -rf "$pnpm_root"
        mkdir -p "$pnpm_root"
        npm install --global --prefix "$pnpm_root" "pnpm@${PNPM_VERSION}"
        {
          echo "PNPM_HOME=$pnpm_root/bin"
          echo "PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS=false"
          echo "NPM_CONFIG_STORE_DIR=$pnpm_root/store"
        } >> "$GITHUB_ENV"
        echo "$pnpm_root/bin" >> "$GITHUB_PATH"
        "$pnpm_root/bin/pnpm" --version

    - name: Classify isolated pnpm store
      id: cache_evidence
      shell: bash
      env:
        LOCK_FILE: ${{ inputs.lock-file }}
        PNPM_VERSION: ${{ steps.resolve_pnpm.outputs.version }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/cache-evidence.mjs" \
          --lock-file "$LOCK_FILE" \
          --node-version "$(node --version)" \
          --pnpm-version "$PNPM_VERSION" \
          --github-output "$GITHUB_OUTPUT"

    - name: Emit exact pnpm cache observation
      id: emit_cache
      if: inputs.job-id != '' && inputs.source-manifest-sha256 != ''
      shell: bash
      env:
        INPUT_CACHE_NAMESPACE: pnpm-store
        INPUT_CACHE_KEY_HASH: ${{ steps.cache_evidence.outputs['cache-key-hash'] }}
        INPUT_LOCK_HASH: ${{ steps.cache_evidence.outputs['lock-hash'] }}
        INPUT_OPERATION: probe
        INPUT_CACHE_CLASS: ${{ steps.cache_evidence.outputs['cache-class'] }}
        INPUT_JOB_ID: ${{ inputs.job-id }}
        INPUT_SOURCE_MANIFEST_SHA256: ${{ inputs.source-manifest-sha256 }}
        INPUT_FINGERPRINT_VERSION: ${{ inputs.fingerprint-version }}
        INPUT_POOL_MAPPING_VERSION: ${{ inputs.pool-mapping-version }}
        INPUT_POLICY_VERSION: ${{ inputs.policy-version }}
        INPUT_COLLECTOR_MODE: hook
        INPUT_OUTPUT_PATH: ci-telemetry/pnpm-store-cache-observation.json
      run: node "$GITHUB_ACTION_PATH/../emit-cache-observation/emit-cache-observation.mjs"
