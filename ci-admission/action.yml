name: CI admission control
description: Manage job-level leases or submit typed advisory work for admission before GitHub creates a workflow.

inputs:
  operation:
    description: Job-level acquire/release, or prequeue-defer/prequeue-status. acquire/release remain compatibility aliases.
    required: false
    default: acquire
  token:
    description: Dedicated CI_ADMISSION_TOKEN bearer secret.
    required: true
  kind:
    description: Job-level admission policy (bot_pr or heavy_validation). Not used by prequeue operations.
    required: false
    default: ""
  subject:
    description: Stable idempotency subject. Required for bot_pr; defaults to the current job identity for heavy_validation.
    required: false
    default: ""
  lease-id:
    description: Opaque lease UUID required when operation is release.
    required: false
    default: ""
  dispatch-id:
    description: Opaque deferred dispatch UUID required by prequeue-status.
    required: false
    default: ""
  repo:
    description: Exact CloudIngenium owner/repository. Defaults to github.repository.
    required: false
    default: ${{ github.repository }}
  automation-wave-id:
    description: Optional bounded identifier for an automation wave.
    required: false
    default: ""
  priority-class:
    description: Bounded priority. Job-level defaults to 40; prequeue advisory defaults to 10.
    required: false
    default: ""
  slot-weight:
    description: Heavy-validation capacity weight from 1 to 4. bot_pr must remain 1.
    required: false
    default: ""
  requested-lane:
    description: Optional bounded capability lane used for admission evidence.
    required: false
    default: ""
  deadline-at:
    description: Optional RFC3339 deadline within the next 24 hours.
    required: false
    default: ""
  ttl-seconds:
    description: Optional bounded lease lifetime.
    required: false
    default: ""
  release-on-post:
    description: auto releases heavy_validation leases; true or false overrides that behavior.
    required: false
    default: auto
  on-denied:
    description: fail rejects the job; defer returns granted=false and deferred=true for advisory callers.
    required: false
    default: fail
  endpoint:
    description: CI admission API base URL.
    required: false
    default: https://gh-hooks.cloudingenium.com
  event-type:
    description: Allowlisted advisory event used by prequeue-defer.
    required: false
    default: ""
  source-digest:
    description: Stable content identity used for repository+event idempotency.
    required: false
    default: ""
  source-sha:
    description: Full Git object id for Skills, Plugins, or Zap coverage events.
    required: false
    default: ""
  scope:
    description: Registered full-validation scope (nightly).
    required: false
    default: ""
  mode:
    description: Zap coverage mode (full or nightly).
    required: false
    default: ""
  producer:
    description: Package source repository name.
    required: false
    default: ""
  commit:
    description: Full producer commit SHA.
    required: false
    default: ""
  source-api-path:
    description: Immutable CloudIngenium contents API path.
    required: false
    default: ""
  digest:
    description: Package source SHA-256 digest without prefix.
    required: false
    default: ""
  source-blob-sha:
    description: Full Git blob SHA for package source.
    required: false
    default: ""
  digest-algorithm:
    description: Digest algorithm; package source requires sha256.
    required: false
    default: ""
  content-digest:
    description: SHA-256 digest of immutable package source bytes.
    required: false
    default: ""
  packages-json:
    description: Bounded JSON array of published package names.
    required: false
    default: ""
  package-versions-json:
    description: Bounded JSON object mapping package names to versions.
    required: false
    default: ""
  repositories:
    description: Comma or newline separated CloudIngenium repositories for fleet-currency-incremental.
    required: false
    default: ""

outputs:
  granted:
    description: True when admission was granted.
  reused:
    description: True when an existing idempotent lease was reused.
  lease-id:
    description: Opaque lease UUID.
  active-count:
    description: Active count observed after the decision.
  active-slot-weight:
    description: Active weighted capacity observed after the decision.
  policy-limit:
    description: Applied policy limit.
  decision-id:
    description: Opaque identifier for the admission decision.
  suggested-wait-ms:
    description: Bounded defer delay in milliseconds.
  retry-after-seconds:
    description: Bounded retry delay when admission was denied.
  deferred:
    description: True only when a valid 429 denial was returned with on-denied=defer.
  released:
    description: True when an explicit release operation succeeded.
  dispatch-id:
    description: Opaque deferred dispatch UUID.
  dispatch-status:
    description: Current prequeue lifecycle state.

runs:
  using: node24
  main: index.mjs
  post: index.mjs
  post-if: always()
