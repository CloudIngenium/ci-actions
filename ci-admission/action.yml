name: CI admission lease
description: Acquire a bounded CloudIngenium CI admission lease and release heavy-validation leases automatically.

inputs:
  operation:
    description: Acquire a lease or release a lease from an upstream control job.
    required: false
    default: acquire
  token:
    description: Dedicated CI_ADMISSION_TOKEN bearer secret.
    required: true
  kind:
    description: Admission policy to apply (bot_pr or heavy_validation).
    required: true
  subject:
    description: Stable idempotency subject. Required for bot_pr; defaults to the current job identity for heavy_validation.
    required: false
    default: ""
  lease-id:
    description: Opaque lease UUID required when operation is release.
    required: false
    default: ""
  repo:
    description: Exact CloudIngenium owner/repository. Defaults to github.repository.
    required: false
    default: ${{ github.repository }}
  automation-wave-id:
    description: Optional bounded identifier for an automation wave.
    required: false
    default: ""
  priority-class:
    description: Bounded scheduling priority from 1 to 100. Required/deploy callers use 100; human PRs 80; bots 40; background 10.
    required: false
    default: "40"
  slot-weight:
    description: Heavy-validation capacity weight from 1 to 4. bot_pr must remain 1.
    required: false
    default: "1"
  requested-lane:
    description: Optional bounded capability lane used for admission evidence.
    required: false
    default: ""
  deadline-at:
    description: Optional RFC3339 deadline within the next 24 hours.
    required: false
    default: ""
  ttl-seconds:
    description: Optional bounded lease lifetime.
    required: false
    default: ""
  release-on-post:
    description: auto releases heavy_validation leases; true or false overrides that behavior.
    required: false
    default: auto
  on-denied:
    description: fail rejects the job; defer returns granted=false and deferred=true for advisory callers.
    required: false
    default: fail
  endpoint:
    description: CI admission API base URL.
    required: false
    default: https://gh-hooks.cloudingenium.com

outputs:
  granted:
    description: True when admission was granted.
  reused:
    description: True when an existing idempotent lease was reused.
  lease-id:
    description: Opaque lease UUID.
  active-count:
    description: Active count observed after the decision.
  active-slot-weight:
    description: Active weighted capacity observed after the decision.
  policy-limit:
    description: Applied policy limit.
  decision-id:
    description: Opaque identifier for the admission decision.
  suggested-wait-ms:
    description: Bounded defer delay in milliseconds.
  retry-after-seconds:
    description: Bounded retry delay when admission was denied.
  deferred:
    description: True only when a valid 429 denial was returned with on-denied=defer.
  released:
    description: True when an explicit release operation succeeded.

runs:
  using: node20
  main: index.mjs
  post: index.mjs
  post-if: always()
