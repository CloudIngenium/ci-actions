name: Secret Scan

# Hosted secret scanner for this PUBLIC repo. The org reusable
# (CloudIngenium/.github secret-scan.yml) is private and runs on self-hosted lanes, so a
# public repo can neither call it nor use those runners; this mirrors its scan (same
# gitleaks pin + checksum, same fleet gitleaks.toml, same .gitleaksignore) on
# GitHub-hosted runners. The job name is the bare `Secret Scan` context the fleet requires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 15 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks

      - name: Gitleaks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            merge_group)  range="$MG_BASE..$MG_HEAD" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              else
                range="--all"
              fi ;;
            *) range="--all" ;;
          esac
          [ -f .gitleaksignore ] || : > .gitleaksignore
          echo "Scanning: $range"
          log="$RUNNER_TEMP/gitleaks.log"
          rc=0
          "$RUNNER_TEMP/bin/gitleaks" detect --source . --config gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore "--log-opts=$range" \
            --verbose --redact --no-banner > "$log" 2>&1 || rc=$?
          cat "$log"
          # gitleaks exits 0 when its own `git log` fails; never read that as clean.
          if grep -qE '\[git\] (fatal|error):' "$log"; then
            echo "::error::gitleaks could not read the git history"
            exit 2
          fi
          exit "$rc"
